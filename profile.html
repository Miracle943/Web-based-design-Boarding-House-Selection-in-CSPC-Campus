<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--Website Icon-->
    <link rel="icon" type="image/png" href="img/logo/CSPC_logo.png">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container">
                <!-- Logo and Brand -->
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="img/logo/f3.jpg" width="30" height="30" alt="CSPC" class="me-2 rounded-circle"> Welcome, Mark
                </a>

                <!-- Toggler for mobile -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

                <!-- Collapsible nav content -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <a class="nav-link active" href="welcome_real.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="profile.html">Profile</a>
                        </li>
                        <li class="nav-item ms-3">
                            <a href="LogIn.html" class="btn btn-primary rounded-pill px-4 py-1" data-bs-toggle="modal" data-bs-target="#logoutModal">Log Out</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container my-5">

        <div class="d-flex justify-content-center mt-4 mb-4">
            <div class="position-relative d-inline-block">
                <!-- Profile Picture -->
                <img src="img/logo/f3.jpg" class="profile-pic " alt="Student Photo">

                <!-- Pencil Icon -->
                <label for="profileInput" class="position-absolute bottom-0 end-0 bg-dark text-white rounded-circle p-2" style="cursor: pointer;">
    <i class="bi bi-pencil-fill"></i>
  </label>

                <!-- Hidden File Input -->
                <input type="file" id="profileInput" accept="image/*" class="d-none">
            </div>
        </div>

        <div class="profile-card mx-auto" style="max-width: 600px;">
            <h4 class="mb-4 text-center"><i class="bi bi-person-circle me-2"></i>Information</h4>

            <form>
                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="text" class="form-control" value="221002008" placeholder="Enter your Student ID">
                </div>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" value="Mark Allen B. Olino" placeholder="Enter your full name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <input type="text" class="form-control" value="BSIS" placeholder="Enter your course (e.g., BSIS)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Year & Section</label>
                    <input type="text" class="form-control" value="4A" placeholder="Enter your year & section (e.g., 4A)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Sex</label>
                    <input type="text" class="form-control" value="Male" placeholder="Enter your sex (e.g., Male/Female)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" value="2004-05-26" placeholder="Select your birth date">
                </div>
                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control" value="21" placeholder="Enter your age">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="marolino@my.cspc.edu.ph" placeholder="Enter your email address">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" value="Zone 2, La Opinion, Nabua, Camarines Sur" placeholder="Enter your home address">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" value="09947345474" placeholder="Enter your contact number" maxlength="11" pattern="[0-9]{11}" title="Contact number must be 11 digits (e.g., 09947345474)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Emergecy Contact</label>
                    <input type="tel" class="form-control" value="09484051644" placeholder="Enter your emergency number" maxlength="11" pattern="[0-9]{11}" title="Contact number must be 11 digits (e.g., 09947345474)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Guardian Name</label>
                    <input type="text" class="form-control" value="Evelyn B. Olino" placeholder="Enter your guardian name">
                </div>
                <button type="submit" class="btn btn-primary btn-save">Save Changes</button>
            </form>


            <!-- Warn the user if he/she is going to log out -->
            <section class="modal fade" tabindex="-1" id="logoutModal">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Warning:</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body ">
                            <div class="alert alert-warning text-center" role="alert ">
                                Are you sure you want to log out?
                            </div>
                        </div>
                        <div class="modal-footer ">
                            <a href="LogIn.html " class="btn btn-primary ">Yes</a>
                            <button type="button " class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                </div>
            </section>
    </main>

    <footer class="bg-dark py-4 mt-5">
        <div class="container text-light text-center">
            <p class="h5 mb-2">CSPC's Boarding Selection</p>
            <small class="text-white-50">&copy; 2025-2026 CSPC's Boarding Selection. All rights reserved.</small>
        </div>
    </footer>

    <!-- Bootstrap JS (optional if modal isn't used) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
